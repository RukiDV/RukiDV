<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- full banner moving background gradient -->
    <linearGradient id="moving-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.15; 0.45; 0.15" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#eba1fe" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.45; 0.15; 0.45" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0a0e27" />
      <animate attributeName="x1" values="0%; 60%; 0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%; 160%; 100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <!-- animated moving border gradient -->
    <linearGradient id="moving-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#eba1fe"/>
      <stop offset="100%" stop-color="#00f0ff"/>
      <animate attributeName="x1" values="0%; 100%; 0%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%; 200%; 100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- banner base background -->
  <rect width="1000" height="220" rx="16" fill="#0a0e27"/>
  
  <!-- full banner animated overlay -->
  <rect width="1000" height="220" rx="16" fill="url(#moving-bg)"/>

  <!-- animated border -->
  <rect x="1" y="1" width="998" height="218" rx="15" fill="none" stroke="url(#moving-border)" stroke-width="2"/>

  <!-- centered content -->
  <foreignObject x="40" y="40" width="920" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; font-family: 'Segoe UI', Ubuntu, sans-serif; text-align: center;">
      
      <!-- main heading  -->
      <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0; font-size: 42px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 0 25px rgba(0, 240, 255, 0.7);">
        <img src="https://raw.githubusercontent.com/RukiDV/RukiDV/images/hand.gif" width="44px" style="vertical-align: middle;" alt="" />
        Hi, I'm Ruki! 🌸
      </h1>

      <!-- subtitle -->
      <p style="margin: 12px 0 0 0; font-size: 18px; font-weight: 600; color: #eba1fe; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 20px rgba(235, 161, 254, 0.6);">
        Passionate programmer, especially when it includes graphics and a splash of color 🌈
      </p>

    </div>
  </foreignObject>
</svg>
